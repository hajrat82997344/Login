<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reader Test</title>
  <style>
    /* Use a centered form layout that adapts to narrow screens. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef3f8;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(100%, 560px);
      padding: 36px;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }
    h1 { margin: 0 0 10px; color: #174a6e; }
    .intro { margin: 0 0 24px; line-height: 1.6; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; }
    input, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #aebdca;
      border-radius: 5px;
      color: #1f2937;
      font: inherit;
    }
    textarea { min-height: 140px; resize: vertical; }
    input:focus, textarea:focus { outline: 3px solid #b9e0eb; border-color: #176b87; }
    button {
      margin-top: 22px;
      padding: 12px 22px;
      border: 0;
      border-radius: 6px;
      background: #176b87;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #10566d; }
    .page-links { margin: 20px 0 0; }
    a { color: #176b87; }
    @media (max-width: 480px) { .card { padding: 26px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>What Did You Read?</h1>
    <p class="intro">Enter your details and write a short summary of the information on the about page.</p>
    <!-- The form sends these named fields to the JSP using an HTTP POST request. -->
    <form method="post" action="verify.jsp">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <label for="email">Email ID</label>
      <input id="email" name="email" type="text" required>

      <label for="summary">Summary</label>
      <textarea id="summary" name="summary" required></textarea>

      <button type="submit">Submit</button>
    </form>
    <p class="page-links"><a href="about.html">Back to About</a></p>
  </main>
</body>
</html>
