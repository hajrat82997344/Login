<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Result</title>
  <style>
    /* Present submitted values in a responsive, readable result card. */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #eef3f8;
      color: #1f2937;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(100%, 620px);
      padding: 36px;
      background: #ffffff;
      border: 1px solid #d9e2ec;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(31, 41, 55, 0.08);
    }
    h1 { margin: 0 0 24px; color: #174a6e; }
    .field { margin: 0 0 20px; }
    .field strong { display: block; margin-bottom: 6px; color: #174a6e; }
    .value { overflow-wrap: anywhere; line-height: 1.6; }
    #summary { white-space: pre-wrap; }
    a { color: #176b87; }
    @media (max-width: 480px) { .card { padding: 26px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Your Details</h1>
    <p class="field"><strong>Name:</strong><span class="value" id="name"></span></p>
    <p class="field"><strong>Email:</strong><span class="value" id="email"></span></p>
    <div class="field">
      <strong>Summary:</strong>
      <div class="value" id="summary"></div>
    </div>
    <a href="about.html">Back to About</a>
    <span aria-hidden="true"> | </span>
    <a href="test.html">Take the test again</a>
  </main>
  <script>
    // Read the URL query parameters and insert them as text, not executable HTML.
    const parameters = new URLSearchParams(window.location.search);
    document.getElementById("name").textContent = parameters.get("name") || "Not provided";
    document.getElementById("email").textContent = parameters.get("email") || "Not provided";
    document.getElementById("summary").textContent = parameters.get("summary") || "Not provided";
  </script>
</body>
</html>
